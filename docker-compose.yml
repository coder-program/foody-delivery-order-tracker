version: "3.9"

services:
  api:
    build:
      context: ./services/api
    container_name: foody-api
    ports:
      - "8080:8080"
    volumes:
      - ./services/api/foody.db:/app/foody.db

  web:
    build:
      context: ./apps/web
    container_name: foody-web
    ports:
      - "5173:80"
    depends_on:
      - api
